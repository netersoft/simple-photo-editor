name: simple_photo_editor
description: 'Simple Photo Editor: quickly edit your photos and share them.'
publish_to: 'none'

####################################################################################################

version: 2.1.0+8
# changelog generator : auto-changelog --template keepachangelog --hide-credit -v [version-name]

environment:
  sdk: '>=3.8.0 <4.0.0'

####################################################################################################

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  path: ^1.9.1
  intl: ^0.20.2
  get_it: ^9.2.1
  logger: ^2.7.0
  share_plus: ^13.2.0
  collection: ^1.19.1
  url_launcher: ^6.3.2
  flutter_phoenix: ^1.1.1
  package_info_plus: ^10.2.0
  flutter_easyloading: ^3.0.5
  shared_preferences: ^2.5.5
  flutter_native_splash: ^2.4.8 # dart run flutter_native_splash:create
  flutter_dotenv: ^6.0.1
  go_router: ^17.3.0
  another_flutter_splash_screen: ^1.2.1
  settings_ui: ^3.0.1
  modal_bottom_sheet: ^3.0.0
  flutter_svg: ^2.3.0
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  slang: ^4.18.0
  slang_flutter: ^4.18.0
  injectable: ^3.0.0
  marionette_flutter: ^0.6.0
  json_annotation: any
  filmkit: ^0.7.1
  image_picker: ^1.2.3
  photo_manager: ^3.12.0
  exif: ^3.3.0
  in_app_review: ^2.0.12
  path_provider: ^2.1.6
  flutter_colorpicker: ^1.1.0
  flutter_widget_from_html_core: ^0.17.4
dev_dependencies:
  flutter_test:
    sdk: flutter

  mocktail: ^1.0.5
  build_runner: ^2.15.0 # dart run build_runner build --delete-conflicting-outputs
  flutter_lints: ^6.0.0
  icons_launcher: ^3.1.0 # dart run icons_launcher:create
  riverpod_generator: ^4.0.4
  riverpod_lint: ^3.1.4
  injectable_generator: ^3.0.2
  go_router_builder: ^4.3.0
  marionette_mcp: ^0.6.0

####################################################################################################

# All icons launcher declinations have size 900x900
icons_launcher:
  image_path: assets/images/launcher/icon.png
  platforms:
    android:
      enable: true
      image_path: assets/images/launcher/icon.png
      # adaptive_background_color: '#ffffff'
      adaptive_background_image: assets/images/launcher/background.png
      adaptive_foreground_image: assets/images/launcher/foreground.png
      adaptive_round_image: assets/images/launcher/icon_round.png
      adaptive_monochrome_image: assets/images/launcher/icon_monochrome.png
    ios:
      enable: true
      image_path: assets/images/launcher/icon.png

# Splash logo have size 1440x1440
flutter_native_splash:
  image: assets/images/launcher/splash_logo.png
  color: '#FFFFFF'
  #background_image: assets/background.png
  #branding: assets/dart.png
  image_dark: assets/images/launcher/splash_logo.png
  color_dark: '#262626'
  #background_image_dark: assets/dark_background.png
  #branding_dark: assets/dark_dart.png
  #branding_mode: bottom
  fullscreen: true
  android_12:
    image: assets/images/launcher/splash_logo.png
    icon_background_color: '#FFFFFF'
    color: '#FFFFFF'
    image_dark: assets/images/launcher/splash_logo.png
    icon_background_color_dark: '#262626'
    color_dark: '#262626'

flutter:
  uses-material-design: true

  assets:
    - .env
    #LAUNCHER
    - assets/images/launcher/splash_logo.png
    # IMAGES
    - assets/images/
    - assets/stickers/
    # I18N
    - assets/i18n/
    - assets/docs/fr/
    - assets/docs/en/

  fonts:
    - family: roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Thin.ttf
          weight: 100
        - asset: assets/fonts/roboto/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/roboto/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/Roboto-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/roboto/Roboto-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/roboto/Roboto-Black.ttf
          weight: 900
